<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Apps</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    text-align: center;
}

header {
    padding: 30px 15px;
    background: #17243a;
}

header h1 {
    color: #38bdf8;
}

.app {
    background: #1e293b;
    max-width: 400px;
    margin: 50px auto;
    padding: 30px;
    border-radius: 20px;
}

.app img {
    width: 100px;
    height: 100px;
    border-radius: 20px;
}

.app h2 {
    margin-top: 20px;
}

.app p {
    color: #cbd5e1;
}

.download {
    display: inline-block;
    background: #0ea5e9;
    color: white;
    padding: 15px 30px;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
    margin-top: 15px;
}

.download:hover {
    background: #0284c7;
}

footer {
    color: #94a3b8;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    <h1>My Apps</h1>
    <p>Download Android Applications</p>
</header>

<div class="app">

    <img src="logo.png" alt="App Logo">

    <h2>Money Manager</h2>

    <p>
        Manage your income and expenses
        easily with Money Manager.
    </p>

    <a class="download"
       href="MyApp.apk">
       Download APK
    </a>

    <p>Version 1.0 | Android</p>

</div>

<footer>
    © 2026 My Apps
</footer>

</body>
</html>
